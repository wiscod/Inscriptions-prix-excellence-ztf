<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidature Prix ZTF · Maquette 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d9b54a;--gold-l:#f8da49;--navy:#030842;--navy2:#0a1450;--green:#33a15a;--paper:#fffdf7;--ink:#14162b;--muted:#6b6f85;--line:#e9e3d2;--ztf-danger:#b42318;--ztf-accent:#b8912a}
.topbar{position:absolute;top:16px;right:16px}
.topbar .lang-switch{border-color:rgba(217,181,74,.5);color:#e2e5f3}
.topbar .lang-switch button[aria-pressed=true]{background:var(--gold);color:var(--navy)}
.head{position:relative}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,system-ui,sans-serif;color:var(--ink);line-height:1.55;background:var(--navy);
  background-image:radial-gradient(ellipse at 20% -10%,rgba(217,181,74,.18),transparent 50%),radial-gradient(ellipse at 100% 30%,rgba(51,161,90,.14),transparent 45%)}
a{color:#8a6a14}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.head{text-align:center;color:#fff;padding:46px 16px 34px}
.laurel{width:64px;height:64px;margin:0 auto 10px;color:var(--gold)}
.head .k{letter-spacing:.32em;text-transform:uppercase;font-size:.72rem;color:var(--gold)}
.head h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(2.2rem,5vw,3.6rem);margin:8px 0 6px;line-height:1.05}
.head p{margin:0 auto;max-width:600px;color:#c9cde4;font-size:.95rem}
.rule{width:120px;height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.shell{max-width:1140px;margin:0 auto;padding:0 16px 70px;display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:start}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static!important}}
.side{position:sticky;top:20px;color:#e2e5f3;border:1px solid rgba(217,181,74,.3);border-radius:18px;padding:22px;background:rgba(255,255,255,.03)}
.ring{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}.ring .bg{stroke:rgba(255,255,255,.12)}.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring b{display:block;font-family:"Cormorant Garamond",serif;font-size:1.6rem;color:#fff;line-height:1}.ring span{font-size:.75rem;color:#a9afcf}
.side h3{font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:0 0 10px;font-weight:600}
.side ol{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:4px}
.side ol a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;color:#dfe3f5;text-decoration:none;font-size:.88rem}
.side ol a:hover{background:rgba(255,255,255,.06)}
.side ol a .d{width:22px;height:22px;border-radius:50%;border:1px solid rgba(217,181,74,.6);display:grid;place-items:center;font-size:.7rem;color:var(--gold);flex:none}
.side ol a.is-complete .d{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.side .dl{font-size:.82rem;color:#c9cde4;border-top:1px solid rgba(255,255,255,.1);padding-top:14px}.side .dl strong{color:var(--gold-l);display:block;font-size:.95rem}
.paper{background:var(--paper);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35);padding:clamp(22px,4vw,48px);position:relative}
.paper:before{content:"";position:absolute;inset:10px;border:1px solid var(--line);border-radius:16px;pointer-events:none}
.paper>*{position:relative}
.sec{margin-bottom:44px;scroll-margin-top:20px}
.sec-h{display:flex;align-items:baseline;gap:14px;margin-bottom:22px}
.sec-h .num{font-family:"Cormorant Garamond",serif;font-size:2.6rem;color:var(--gold);line-height:.8;font-weight:700}
.sec-h h2{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:1.75rem;margin:0;color:var(--navy)}
.sec-h:after{content:"";flex:1;height:1px;background:var(--line);align-self:center}
.f-grid{display:grid;gap:20px;margin-bottom:20px}.cols-2{grid-template-columns:repeat(2,1fr)}.cols-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:700px){.cols-2,.cols-3{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:20px;min-width:0}.f-grid .field{margin-bottom:0}
.field>label{font-weight:600;font-size:.86rem;color:var(--navy)}.field>label i{color:var(--ztf-accent);font-style:normal}
.muted{color:var(--muted);font-weight:400}
input,select,textarea{font:inherit;font-size:.95rem;width:100%;padding:12px 14px;border:1px solid #ddd5bf;border-radius:10px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,181,74,.25)}
input:disabled,select:disabled{background:#f6f3ea;color:#a8a28f}
.phone{display:flex;gap:8px}
.np{display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--muted);font-weight:400}.np input{width:auto;accent-color:var(--navy)}
.notice{border:1px solid var(--line);background:#fbf6e6;border-radius:10px;padding:12px 14px;font-size:.88rem;margin:0 0 20px}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.link-btn{align-self:flex-start;background:none;border:0;color:#8a6a14;font:inherit;font-size:.84rem;font-weight:700;cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}.link-btn:disabled{opacity:.4}
.drop{background:#fff;border-color:#d8cfb4}
.guardian,.gce{border:1px solid var(--line);background:#fbf6e6;border-radius:14px;padding:18px 18px 2px;margin:0 0 20px}
.guardian-h,.gce-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:14px}
.guardian-h strong,.gce-h strong{font-family:"Cormorant Garamond",serif;font-size:1.25rem;color:var(--navy)}
.guardian-h span,.gce-h span{font-size:.82rem;color:var(--muted)}
.choice-opt{background:#fff;border-color:#ddd5bf}.choice-opt b{font-family:"Cormorant Garamond",serif;font-size:1.2rem;color:var(--navy)}
.choice-opt:has(input:checked){border-color:var(--gold);background:#fffaf0}
.facts{display:grid;gap:10px;margin:0 0 20px;padding:0;list-style:none;font-size:.82rem;color:#c9cde4}
.facts b{font-family:"Cormorant Garamond",serif;font-size:1.4rem;color:#fff;font-weight:600;margin-right:6px}
.consent-wrap{border-top:1px solid var(--line);padding-top:26px}
.consent .np{color:var(--ink);font-size:.9rem;align-items:flex-start}
.captcha{margin:12px 0 18px}
.submit{width:100%;padding:17px;border:0;border-radius:12px;background:linear-gradient(135deg,#e7c75c,#c79d2f);color:var(--navy);font:inherit;font-weight:700;font-size:1.02rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 24px rgba(199,157,47,.35)}
.submit:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.foot-note{text-align:center;font-size:.8rem;color:var(--muted);margin:10px 0 0}
.success{text-align:center;padding:30px 10px}
.success h2{font-family:"Cormorant Garamond",serif;font-size:2.6rem;color:var(--navy);margin:8px 0}
.success button{margin-top:16px;font:inherit;font-weight:700;padding:12px 22px;border-radius:12px;border:1px solid var(--gold);background:#fff;cursor:pointer}
footer{text-align:center;color:#8c92b8;font-size:.8rem;padding:0 16px 30px}
</style>
<script>
window.ZTF_PAGE_I18N = {
  "p.k": ["Fondation Zacharias Tanee Fomum · Cameroun", "Zacharias Tanee Fomum Foundation · Cameroon"],
  "p.lead": ["Dossier de candidature : l'excellence dans le faire et dans l'être.", "Application file: excellence in doing and in being."],
  "p.toc": ["Sommaire", "Contents"],
  "p.facts": ["Le Prix en bref", "The Award at a glance"],
  "p.f1": ["éditions depuis 2021", "editions since 2021"],
  "p.f2": ["participants en 2025", "participants in 2025"],
  "p.f3": ["régions du Cameroun", "regions of Cameroon"],
  "p.dl": ["Vous pouvez soumettre votre dossier jusqu'à cette date incluse.", "You can submit your application up to and including this date."],
  "p.footer": ["Maquette 5 « Prestige »", "Mock-up 5 “Prestige”"]
};
</script>
</head>
<body>
<header class="head">
  <svg class="laurel" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
    <path d="M32 54c-10-2-18-11-19-23M32 54c10-2 18-11 19-23"/>
    <path d="M14 40c-4-1-6-4-6-8 4 0 6 3 6 8zM13 31c-4-2-5-5-4-9 4 1 5 4 4 9zM15 22c-3-3-3-6-1-9 3 2 3 5 1 9zM50 40c4-1 6-4 6-8-4 0-6 3-6 8zM51 31c4-2 5-5 4-9-4 1-5 4-4 9zM49 22c3-3 3-6 1-9-3 2-3 5-1 9z" fill="currentColor" fill-opacity=".25"/>
    <circle cx="32" cy="28" r="9"/><path d="M28 28l3 3 5-6"/>
  </svg>
  <div class="topbar" data-ztf-slot="lang"></div>
  <div class="k" data-i18n="p.k"></div>
  <h1 data-i18n="brand.name"></h1>
  <p data-i18n="p.lead"></p>
  <div class="rule"></div>
</header>

<div class="shell">
  <aside class="side" data-ztf-hide-on-success>
    <div class="ring">
      <svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="27"/><circle class="fg" id="ringfg" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="169.6"/></svg>
      <div><b data-ztf-progress-text>0 %</b><span data-i18n="progress.done"></span></div>
    </div>
    <h3 data-i18n="p.toc"></h3>
    <ol>
      <li><a href="#s1" data-ztf-nav="s1"><span class="d">I</span><span data-i18n="sec.identity.s"></span></a></li>
      <li><a href="#s2" data-ztf-nav="s2"><span class="d">II</span><span data-i18n="sec.academic"></span></a></li>
      <li><a href="#s3" data-ztf-nav="s3"><span class="d">III</span><span data-i18n="sec.attachments"></span></a></li>
    </ol>
    <h3 data-i18n="p.facts"></h3>
    <ul class="facts"><li><b>5</b><span data-i18n="p.f1"></span></li><li><b>6 300</b><span data-i18n="p.f2"></span></li><li><b>10</b><span data-i18n="p.f3"></span></li></ul>
    <div class="dl"><span data-i18n="deadline.label"></span><strong id="dl"></strong><span data-i18n="p.dl"></span></div>
  </aside>

  <main class="paper">
    <div data-ztf-hide-on-success>
      <form data-ztf-form>
        <section class="sec" id="s1" data-ztf-section><div class="sec-h"><span class="num">I</span><h2 data-i18n="sec.identity"></h2></div><div data-ztf-slot="identity"></div></section>
        <section class="sec" id="s2" data-ztf-section><div class="sec-h"><span class="num">II</span><h2 data-i18n="sec.academic"></h2></div><div data-ztf-slot="subsystem"></div><div data-ztf-slot="academic"></div></section>
        <section class="sec" id="s3" data-ztf-section><div class="sec-h"><span class="num">III</span><h2 data-i18n="sec.attachments"></h2></div><div data-ztf-slot="attachments"></div></section>
        <div class="consent-wrap" data-ztf-slot="consent"></div>
      </form>
    </div>
    <div class="success" data-ztf-success hidden>
      <svg class="laurel" style="color:#c79d2f" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="32" cy="32" r="22"/><path d="M23 32l6 6 12-13"/></svg>
      <h2 data-i18n="success.title"></h2>
      <p><span data-i18n="success.text"></span> <strong data-ztf-success-email></strong></p>
      <button type="button" data-ztf-reset data-i18n="btn.new"></button>
    </div>
  </main>
</div>
<footer>© <span data-i18n="brand.org"></span> · <span data-i18n="p.footer"></span></footer>

<script src="shared/form-data.js"></script>
<script src="shared/form-i18n.js"></script>
<script src="shared/form-markup.js"></script>
<script src="shared/form-engine.js"></script>
<script>
document.addEventListener("ztf:lang", function () {
  document.getElementById("dl").textContent = ZTF.lang() === "en" ? ZTF_DATA.deadline[1] : ZTF_DATA.deadline[0];
});
document.addEventListener("ztf:progress", function (e) {
  var c = document.getElementById("ringfg"); if (c) c.style.strokeDashoffset = 169.6 * (1 - e.detail.percent / 100);
});
</script>
</body>
</html>
