<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidature ENSPY · Prix ZTF · Maquette 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Great+Vibes&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../affiche/affiche.css">
<style>
body{background:var(--paper);color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(320px,40%) 1fr;min-height:100vh}
.layout>*{min-width:0}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
/* Colonne affiche */
.poster{background:var(--night);position:relative}
.poster-in{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;gap:18px}
.poster img{max-height:calc(100vh - 150px);max-width:100%;border-radius:14px;box-shadow:0 0 0 1px var(--line),0 30px 60px rgba(0,0,0,.6)}
.poster .countdown div{min-width:58px}
@media(max-width:980px){.poster-in{position:static;height:auto;padding:22px 16px}.poster img{max-height:none;width:min(420px,100%)}}
.poster .lbl{color:#b9bfe6;font-size:.8rem;text-align:center}
/* Colonne formulaire */
.main{padding:28px clamp(16px,5vw,64px) 80px;max-width:880px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.head .script{font-size:clamp(2.4rem,4.5vw,3.4rem);color:var(--navy)}
.head .sub{font-family:Cinzel,serif;font-weight:900;font-size:1.05rem;letter-spacing:.06em;margin-top:2px}
.head .ed{display:block;font-family:Montserrat,sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-top:6px}
.dl{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px;margin:0 0 22px;font-size:.9rem}
.dl b{color:var(--gold-l)}
.dl .dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(214,31,38,.25);flex:none}
.sec{margin-bottom:38px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 18px;padding-bottom:10px;border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--gold),transparent) 1}
.sec-h .n{font-family:Cinzel,serif;font-weight:900;font-size:1.6rem;color:var(--gold-d)}
.sec-h h2{margin:0;font-size:1.1rem;color:var(--navy);text-transform:uppercase;letter-spacing:.05em}
.success{text-align:center;padding:30px 0}
.success h2{font-family:Cinzel,serif;color:var(--navy)}
.success .again{margin-top:14px;font:inherit;font-weight:700;padding:11px 20px;border-radius:999px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.foot{margin-top:30px;padding-top:16px;border-top:1px solid #e1d6b4;color:var(--muted);font-size:.82rem}
</style>
<link rel="stylesheet" href="../ecoles.css">
</head>
<body class="v4">
<!-- Maquette 4 « Couleurs de l'école » : générée par scripts/maquettes-ecoles.mjs depuis site/index.html, ne pas modifier à la main. -->
<div class="layout">
  <aside class="poster sparkle">
    <div class="poster-in">
      <img src="../../affiche/img/affiche-gala.jpg" alt="Affiche du Prix d'Excellence Zacharias Tanee Fomum, 6e édition, 12 décembre 2026 à 08h00 au Palais des Sports de Yaoundé">
      <div data-cd-open>
        <div class="countdown"><div><b data-cd="d">00</b><span data-i18n="a.cd.days"></span></div><div><b data-cd="h">00</b><span data-i18n="a.cd.hours"></span></div><div><b data-cd="m">00</b><span data-i18n="a.cd.min"></span></div></div>
        <p class="lbl" data-i18n="a.cd.left"></p>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="hero">
      <div class="hero-bg"><img src="../img/enspy-batiment.jpg" alt="Bâtiment des salles de cours de l'ENSPY"></div>
      <div class="hero-lang" data-ztf-slot="lang"></div>
      <div class="hero-in">
        <div class="medals">
          <figure class="medal school-logo"><img src="../img/enspy-logo.jpg" alt="Logo de l'ENSPY" data-i18n-aria="e.enspy.logo.alt"></figure>
          <figure class="medal prize"><img src="../img/prix-provisoire.jpg" alt="Logo du prix (provisoire)" data-i18n-aria="e.prize.alt"></figure>
        </div>
        <div class="txt"><h1 class="title"><span class="k" data-i18n="e.apply"></span> <span class="s">ENSPY</span></h1>
        <p class="school-name"><span data-i18n="e.enspy.name"></span> · <span data-i18n="e.enspy.univ"></span></p>
        <ul class="facts">
          <li><span class="l" data-i18n="e.deadline"></span> <b class="v" data-i18n="e.deadline.v"></b></li>
          <li><span class="l" data-i18n="e.audition"></span> <span class="tbd" data-i18n="e.tbd"></span></li>
          <li><span class="l" data-i18n="e.venue"></span> <span class="tbd" data-i18n="e.tbd"></span></li>
        </ul></div>
      </div>
      <p class="credit"><span data-i18n="e.photo"></span> : Marcell NEMG, <a href="https://commons.wikimedia.org/wiki/File:Batiment-polytech-cmr.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.fr" target="_blank" rel="noopener">CC BY-SA 4.0</a></p>
    </header>

    <div class="form-light">
      <div data-ztf-hide-on-success>
        <div data-ztf-slot="lookup"></div>
        <form data-ztf-form>
          <section class="sec" id="s1" data-ztf-section><div class="sec-h"><span class="n">I</span><h2 data-i18n="sec.identity"></h2></div><div data-ztf-slot="identity"></div></section>
          <section class="sec" id="s2" data-ztf-section><div class="sec-h"><span class="n">II</span><h2 data-i18n="sec.academic"></h2></div><div data-ztf-slot="academic"></div></section>
          <section class="sec" id="s3" data-ztf-section><div class="sec-h"><span class="n">III</span><h2 data-i18n="sec.attachments"></h2></div><div data-ztf-slot="attachments"></div></section>
          <div data-ztf-slot="consent"></div>
        </form>
      </div>
      <div class="success" data-ztf-success hidden>
        <h2 data-i18n="success.title"></h2>
        <div data-ztf-slot="receipt"></div>
        <button class="again" type="button" data-ztf-reset data-i18n="btn.new"></button>
      </div>
    </div>
    <div class="foot"><div class="contacts" style="justify-content:flex-start"><span>excellenceawardsztf.com</span><span><a href="https://wa.me/33652748082" target="_blank" rel="noopener" style="color:inherit;white-space:nowrap"><svg viewBox="0 0 24 24" width="16" height="16" aria-label="WhatsApp" role="img" style="vertical-align:-3px;margin-right:4px"><path fill="#25D366" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg><span data-i18n="a.phones"></span></a></span></div><p data-i18n="brand.org"></p></div>
  </main>
</div>

<script src="../../shared/ztf-lists.js"></script>
<script src="../../shared/form-i18n.js"></script>
