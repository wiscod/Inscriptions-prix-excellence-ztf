<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06104a">
<title>Candidature Prix ZTF · Mobile gala</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Great+Vibes&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="affiche.css">
<style>
html,body{background:#020726}
body{color:#fff}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--navy);box-shadow:0 0 0 1px rgba(232,185,60,.15);padding-bottom:150px}
.bar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:rgba(6,16,74,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar b{font-family:Cinzel,serif;color:var(--gold);letter-spacing:.06em;font-size:.95rem}
.bar .pct{font-weight:800;font-size:.85rem;color:var(--night);background:var(--gold);padding:3px 9px;border-radius:999px}
.bar .lang-switch button{padding:6px 9px}
.track{height:4px;background:rgba(255,255,255,.12)}.track div{height:100%;width:0;background:linear-gradient(90deg,#f0c64f,#fff0b3);transition:width .35s}
.hero{position:relative;text-align:center;padding:18px 16px 22px;background:linear-gradient(180deg,rgba(6,16,74,.1),var(--navy) 85%),url(img/trophee.jpg) center 30%/cover}
.hero .script{font-size:3rem;margin-top:110px;text-shadow:0 3px 14px rgba(0,0,0,.7)}
.hero h1{margin:2px 0 0;font-family:Cinzel,serif;font-weight:900;font-size:1.45rem;line-height:1.05}
.hero .ed{margin-top:8px;font-family:Cinzel,serif;color:var(--gold-l)}
.dl{margin:14px 12px 0;border-radius:16px;padding:14px;text-align:center;background:linear-gradient(180deg,#ec2b31,var(--red-d));box-shadow:0 10px 24px rgba(0,0,0,.35)}
.dl .t{font-weight:800;text-transform:uppercase;font-size:.85rem;letter-spacing:.04em}
.dl .countdown{margin-top:10px}.dl .countdown div{min-width:62px;background:rgba(3,10,51,.4);border-color:rgba(255,233,163,.5)}
.list{padding:14px 12px;display:grid;gap:12px}
details.sec{border:1px solid var(--line);border-radius:18px;background:rgba(11,26,107,.6);overflow:hidden}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:15px;cursor:pointer;font-weight:800}
details.sec>summary::-webkit-details-marker{display:none}
summary .n{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:Cinzel,serif;font-weight:900;color:var(--night);background:linear-gradient(180deg,#fff0b3,#f0c64f 45%,#c98f23)}
summary .t{flex:1;min-width:0}summary small{display:block;font-weight:500;color:#b9bfe6;font-size:.76rem}
summary .st{font-size:.7rem;font-weight:800;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.1);white-space:nowrap}
details.sec.is-complete summary .st{background:var(--gold);color:var(--night)}
.body{padding:14px 14px 16px;border-top:1px solid var(--line)}
.form-dark input,.form-dark select,.form-dark textarea{font-size:16px;min-height:50px}
.form-dark .np input{min-height:0}
.lookup-wrap{padding:14px 12px 0}
.consent-card{margin:2px 12px 0;padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(11,26,107,.6)}
.consent-card .submit{display:none}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(3,10,51,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.dock-in{max-width:488px;margin:auto;display:flex;align-items:center;gap:12px}
.dock .info{flex:1;font-size:.76rem;color:#b9bfe6;line-height:1.25}.dock .info b{display:block;color:#fff;font-size:.95rem}
.dock .btn-gold{width:auto;flex:none;padding:14px 18px;font-size:.82rem}
.success{padding:30px 18px;text-align:center}
.success h2{font-family:Cinzel,serif;color:var(--gold-l)}
.success .again{margin-top:14px;font:inherit;font-weight:700;padding:12px 20px;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--gold-l)}
.foot{text-align:center;color:#b9bfe6;font-size:.78rem;padding:20px 16px 0}
.ztf-demo{bottom:92px!important}
</style>
</head>
<body>
<div class="app form-dark">
  <header class="bar on-dark"><b>ZTF AWARDS</b><span class="pct" data-ztf-progress-text>0 %</span><div data-ztf-slot="lang"></div></header>
  <div class="track"><div data-ztf-progress></div></div>

  <div class="hero sparkle">
    <div class="script">Prix d'Excellence</div>
    <h1 class="gold-text">ZACHARIAS TANEE FOMUM</h1>
    <div class="ed gold-rule" data-i18n="a.edition"></div>
  </div>

  <div data-ztf-hide-on-success>
    <div class="dl">
      <div class="t"><span data-i18n="a.until"></span> <span data-i18n="a.until.date"></span></div>
      <div class="countdown" data-cd-open><div><b data-cd="d">00</b><span data-i18n="a.cd.days"></span></div><div><b data-cd="h">00</b><span data-i18n="a.cd.hours"></span></div><div><b data-cd="m">00</b><span data-i18n="a.cd.min"></span></div><div><b data-cd="s">00</b><span data-i18n="a.cd.sec"></span></div></div>
      <div data-cd-closed hidden data-i18n="a.cd.closed"></div>
    </div>
    <div class="lookup-wrap" data-ztf-slot="lookup"></div>
    <form data-ztf-form id="form">
      <div class="list">
        <details class="sec" id="s1" data-ztf-section open>
          <summary><span class="n">1</span><span class="t"><span data-i18n="sec.identity"></span><small data-i18n="sec.identity.s"></small></span><span class="st"></span></summary>
          <div class="body" data-ztf-slot="identity"></div>
        </details>
        <details class="sec" id="s2" data-ztf-section>
          <summary><span class="n">2</span><span class="t"><span data-i18n="sec.academic"></span><small data-i18n="sec.academic.s"></small></span><span class="st"></span></summary>
          <div class="body" data-ztf-slot="academic"></div>
        </details>
        <details class="sec" id="s3" data-ztf-section>
          <summary><span class="n">3</span><span class="t"><span data-i18n="sec.attachments"></span><small data-i18n="sec.attachments.s"></small></span><span class="st"></span></summary>
          <div class="body" data-ztf-slot="attachments"></div>
        </details>
      </div>
      <div class="consent-card" data-ztf-slot="consent"></div>
    </form>
    <div class="foot"><div>☎ <span data-i18n="a.phones"></span></div><div><span data-i18n="a.mock"></span> · 5</div></div>
  </div>

  <div class="success" data-ztf-success hidden>
    <h2 data-i18n="success.title"></h2>
    <div data-ztf-slot="receipt"></div>
    <button class="again" type="button" data-ztf-reset data-i18n="btn.new"></button>
  </div>
</div>

<div class="dock" data-ztf-hide-on-success><div class="dock-in">
  <div class="info"><b data-ztf-progress-text>0 %</b><span data-i18n="progress.done"></span></div>
  <button type="submit" form="form" class="btn-gold"><span data-i18n="btn.submit"></span></button>
</div></div>

<script>
window.ZTF_PAGE_I18N = { "p.todo": ["À remplir", "To do"], "p.done": ["✓ Complet", "✓ Done"] };
</script>
<script src="../shared/form-data.js"></script>
<script src="../shared/ztf-lists.js"></script>
<script src="../shared/form-i18n.js"></script>
<script src="affiche.js"></script>
<script src="../shared/form-markup.js"></script>
<script src="../shared/form-engine.js"></script>
<script>
(function () {
  function badges() {
    [].forEach.call(document.querySelectorAll("details.sec"), function (d) {
      d.querySelector(".st").textContent = ZTF.tr(d.classList.contains("is-complete") ? "p.done" : "p.todo");
    });
  }
  document.addEventListener("ztf:progress", badges);
  document.addEventListener("ztf:lang", badges);
  document.addEventListener("ztf:invalid", function (e) { var d = e.detail.first.closest("details"); if (d) d.open = true; });
})();
</script>
</body>
</html>
