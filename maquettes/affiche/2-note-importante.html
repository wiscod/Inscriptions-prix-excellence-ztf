<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidature Prix ZTF · Note importante</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Great+Vibes&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="affiche.css">
<style>
body{color:#fff;background:var(--navy);
  background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 46px),radial-gradient(ellipse at 85% 10%,rgba(80,120,255,.35),transparent 55%),radial-gradient(ellipse at 10% 90%,rgba(232,185,60,.18),transparent 50%);background-attachment:fixed}
.page{max-width:980px;margin:0 auto;padding:22px 16px 90px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.bar .brand{font-family:Cinzel,serif;font-weight:900;letter-spacing:.08em}
.title{text-align:center;margin:0 0 26px}
.title .ribbon{font-size:clamp(1rem,2.6vw,1.45rem)}
.frame{position:relative;border:2px solid var(--gold);border-radius:24px;background:rgba(6,16,74,.82);padding:clamp(20px,4vw,40px);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.note{text-align:center;font-weight:700;font-size:clamp(.98rem,2vw,1.12rem);line-height:1.45}
.note .g{color:var(--gold)}
.note p{margin:0 0 12px}
.note .caps{text-transform:uppercase}
.prog{margin:26px 0 6px}
.prog h2{text-align:center;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;margin:0 0 16px}
.prog ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:14px 26px}
@media(max-width:640px){.prog ul{grid-template-columns:1fr}}
.prog li{display:flex;gap:12px;align-items:center;font-weight:700;font-size:.92rem}
.prog li span{color:var(--gold-l)}
.ic{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#13247f,#06104a);box-shadow:0 0 0 3px var(--gold),0 0 0 5px #8a5c12}
.ic svg{width:24px;height:24px;fill:var(--gold-l)}
.speakers{text-align:center;font-weight:600;font-size:.9rem;margin:18px 0 0;color:#dfe3ff}
.cta{text-align:center;margin:14px 0 0;font-weight:800;text-transform:uppercase;font-size:.95rem}
.cta span{color:var(--gold)}
.seal-pos{position:absolute;left:-100px;bottom:-30px}
@media(max-width:1240px){.seal-pos{position:static;display:flex;justify-content:center;margin:26px 0 -6px}}
.form-frame{margin-top:70px}
@media(max-width:1240px){.form-frame{margin-top:34px}}
.sec{margin-bottom:38px}
.sec-h{margin:0 0 22px}
.sec-h .ribbon{font-size:.95rem;padding:8px 22px}
.success{text-align:center;padding:24px 8px}
.success h2{color:var(--gold-l);text-transform:uppercase}
.success .again{margin-top:14px;font:inherit;font-weight:700;padding:11px 20px;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--gold-l);cursor:pointer}
footer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(180deg,#f7dc86,#c99a33);color:var(--night);padding:10px 16px}
footer .contacts{font-size:.85rem}
</style>
</head>
<body>
<div class="page">
  <div class="bar on-dark"><span class="brand gold-text">ZTF Excellence Awards</span><div data-ztf-slot="lang"></div></div>

  <div class="title"><span class="ribbon" data-i18n="a.note.title"></span></div>

  <section class="frame" data-ztf-hide-on-success>
    <div class="note">
      <p class="g" data-i18n="a.note.1"></p>
      <p data-i18n="a.note.2"></p>
      <p class="g" data-i18n="a.note.3"></p>
      <p class="caps" data-i18n="a.note.4"></p>
    </div>
    <div class="prog">
      <h2 data-i18n="a.prog"></h2>
      <ul>
        <li><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 2a4 4 0 110 8 4 4 0 010-8zm-7 20v-3a5 5 0 015-5h4a5 5 0 015 5v3H5z"/></svg></span><span data-i18n="a.prog.1"></span></li>
        <li><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 20h18v2H3zM5 14h3v5H5zm5-4h3v9h-3zm5-5h3v14h-3zM4 10l6-5 4 3 6-6 1 1-7 7-4-3-5 4z"/></svg></span><span data-i18n="a.prog.2"></span></li>
        <li><span class="ic"><svg viewBox="0 0 24 24"><path d="M8 11a3 3 0 100-6 3 3 0 000 6zm8 0a3 3 0 100-6 3 3 0 000 6zM2 19v-1a4 4 0 014-4h4a4 4 0 014 4v1H2zm12 0v-1c0-1.2-.4-2.3-1-3.2.3-.1.7-.1 1-.1h4a4 4 0 014 4v.3H14z"/></svg></span><span data-i18n="a.prog.3"></span></li>
        <li><span class="ic"><svg viewBox="0 0 24 24"><path d="M7 3h10v2h4v3a5 5 0 01-5 5h-.3A5 5 0 0113 15.9V18h3v3H8v-3h3v-2.1A5 5 0 018.3 13H8a5 5 0 01-5-5V5h4zm0 4H5v1a3 3 0 002 2.8zm10 0v3.8A3 3 0 0019 8V7z"/></svg></span><span data-i18n="a.prog.4"></span></li>
      </ul>
    </div>
    <p class="speakers" data-i18n="a.speakers"></p>
    <p class="cta"><span data-i18n="a.cta"></span></p>
    <div class="seal-pos"><div class="seal"><div><small data-i18n="a.until"></small><b data-i18n="a.until.date"></b></div></div></div>
  </section>

  <section class="frame form-frame form-dark">
    <div data-ztf-hide-on-success>
      <div data-ztf-slot="lookup"></div>
      <form data-ztf-form>
        <section class="sec" id="s1" data-ztf-section><div class="sec-h"><span class="ribbon">1 · <span data-i18n="sec.identity"></span></span></div><div data-ztf-slot="identity"></div></section>
        <section class="sec" id="s2" data-ztf-section><div class="sec-h"><span class="ribbon">2 · <span data-i18n="sec.academic"></span></span></div><div data-ztf-slot="academic"></div></section>
        <section class="sec" id="s3" data-ztf-section><div class="sec-h"><span class="ribbon">3 · <span data-i18n="sec.attachments"></span></span></div><div data-ztf-slot="attachments"></div></section>
        <div data-ztf-slot="consent"></div>
      </form>
    </div>
    <div class="success" data-ztf-success hidden>
      <h2 data-i18n="success.title"></h2>
      <div data-ztf-slot="receipt"></div>
      <button class="again" type="button" data-ztf-reset data-i18n="btn.new"></button>
    </div>
  </section>
</div>

<footer><div class="contacts"><span>🌐 excellenceawardsztf.com</span><span>☎ <span data-i18n="a.phones"></span></span><span>· <span data-i18n="a.mock"></span> · 2</span></div></footer>

<script src="../shared/form-data.js"></script>
<script src="../shared/ztf-lists.js"></script>
<script src="../shared/form-i18n.js"></script>
<script src="affiche.js"></script>
<script src="../shared/form-markup.js"></script>
<script src="../shared/form-engine.js"></script>
</body>
</html>
