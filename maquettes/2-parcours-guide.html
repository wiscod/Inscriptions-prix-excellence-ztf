<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidature Prix ZTF · Maquette 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#33a15a;--green-d:#1f7a40;--yellow:#f8da49;--navy:#030842;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#fbfaf6;--ztf-danger:#c0392b;--ztf-accent:#030842}
*{box-sizing:border-box}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
a{color:var(--green-d)}
.top{max-width:900px;margin:auto;padding:22px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;color:var(--navy);min-width:0}
.brand .mark{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:.72rem;flex:none}
.top .r{display:flex;align-items:center;gap:16px}
.help{font-size:.8rem;color:var(--muted)}@media(max-width:700px){.help{display:none}}
.intro{max-width:900px;margin:0 auto;padding:8px 16px 0}
.intro h1{font-size:clamp(1.6rem,3.6vw,2.3rem);margin:0 0 6px;color:var(--navy);letter-spacing:-.02em}
.intro p{margin:0;color:var(--muted)}
.deadline{display:inline-block;margin-top:14px;background:var(--navy);color:#fff;border-radius:999px;padding:7px 14px;font-size:.82rem}
.deadline strong{color:var(--yellow)}
.steps{max-width:900px;margin:28px auto 0;padding:0 16px;list-style:none;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.steps li{position:relative;padding-top:14px;font-size:.8rem;color:var(--muted);font-weight:600;cursor:default}
.steps li:before{content:"";position:absolute;top:0;left:0;right:0;height:5px;border-radius:5px;background:var(--line)}
.steps li.done:before{background:var(--green)}.steps li.cur:before{background:linear-gradient(90deg,var(--navy) 50%,var(--line) 50%)}
.steps li.cur{color:var(--navy)}.steps li.done{color:var(--green-d);cursor:pointer}
.steps li>span{display:block;font-size:.68rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
@media(max-width:640px){.steps li b{display:none}}
.panel{max-width:900px;margin:20px auto 90px;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,36px);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.step-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.step-h h2{margin:0;font-size:1.35rem;color:var(--navy)}.step-h p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.step-h .k{font-size:.78rem;font-weight:700;color:var(--green-d);background:#eaf6ee;padding:4px 10px;border-radius:999px;white-space:nowrap}
.f-grid{display:grid;gap:18px;margin-bottom:18px}.cols-2{grid-template-columns:repeat(2,1fr)}.cols-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:700px){.cols-2,.cols-3{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;min-width:0}.f-grid .field{margin-bottom:0}
.field>label{font-weight:700;font-size:.85rem}.field>label i{color:var(--ztf-danger);font-style:normal}
.muted{color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;font-size:.95rem;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fafafa;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);background:#fff}
input:disabled,select:disabled{opacity:.55}
.phone{gap:8px}
.np{display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--muted);font-weight:500}.np input{width:auto;accent-color:var(--green)}
.notice{background:#f0f6ff;border:1px solid #dbe7fb;color:#1e3a8a;padding:12px 14px;border-radius:12px;font-size:.86rem;margin:0 0 18px}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.link-btn{align-self:flex-start;background:none;border:0;color:var(--green-d);font:inherit;font-size:.84rem;font-weight:700;cursor:pointer;padding:2px 0}.link-btn:disabled{opacity:.4}
.drop{background:#fafafa}
/* Profil : grandes cartes de choix */
.profile .field>label{font-size:1rem;color:var(--navy)}
.profile .choice{grid-template-columns:repeat(2,1fr)}
@media(max-width:560px){.profile .choice{grid-template-columns:1fr}}
.profile .choice-opt{padding:20px;border-radius:16px;border-width:2px;background:#fff}
.profile .choice-opt b{font-size:1.05rem;color:var(--navy)}
.profile .choice-opt:has(input:checked){background:#f4f5fb;border-color:var(--navy)}
.need{margin-top:6px;border-radius:16px;background:#fbfaf6;border:1px dashed #d6d3c4;padding:16px 18px}
.need h3{margin:0 0 8px;font-size:.9rem;color:var(--navy)}
.need ul{margin:0;padding-left:20px;font-size:.88rem;color:#374151;display:grid;gap:4px}
.guardian,.gce{border-radius:16px;background:#fff8dc;border:1px solid #f3e3a3;padding:16px 16px 2px;margin-bottom:18px}
.guardian-h,.gce-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:14px}
.guardian-h strong,.gce-h strong{color:var(--navy)}.guardian-h span,.gce-h span{font-size:.82rem;color:#7a6417}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.btn{font:inherit;font-weight:700;padding:13px 22px;border-radius:12px;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;margin-left:auto}
.ztf-recap-group{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.ztf-recap-group h4{margin:0 0 10px;font-size:.9rem;color:var(--navy);display:flex;justify-content:space-between;gap:10px}
.ztf-recap-group dl{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:6px 14px;margin:0;font-size:.86rem}
.ztf-recap-group dt{color:var(--muted)}.ztf-recap-group dd{margin:0;font-weight:600;overflow-wrap:anywhere}.ztf-recap-group dd.is-empty{color:#cbd5e1;font-weight:400}
.edit{font-size:.78rem;font-weight:700;color:var(--green-d);background:none;border:0;cursor:pointer;font-family:inherit;flex:none}
.consent-box{margin-top:18px;background:#fbfaf6;border-radius:14px;padding:16px}
.consent .np{color:var(--ink);font-size:.9rem;align-items:flex-start}
.captcha{margin:12px 0 16px}
.submit{width:100%;padding:16px;border:0;border-radius:14px;background:var(--green);color:#fff;font:inherit;font-weight:800;font-size:1.02rem;cursor:pointer}
.submit:disabled{opacity:.45;cursor:not-allowed}
.foot-note{text-align:center;font-size:.8rem;color:var(--muted);margin:10px 0 0}
.success{text-align:center;padding:30px 8px}
.success .ok{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:2.3rem;color:var(--navy)}
.success h2{color:var(--navy)}
</style>
<script>
window.ZTF_PAGE_I18N = {
  "p.help": ["Besoin d'aide ?", "Need help?"],
  "p.title": ["Votre candidature, pas à pas", "Your application, step by step"],
  "p.lead": ["Environ 10 minutes. Le formulaire s'adapte à votre profil : élève ou étudiant, francophone ou anglophone.", "About 10 minutes. The form adapts to your profile: pupil or student, francophone or anglophone."],
  "p.step": ["Étape", "Step"],
  "p.s0": ["Profil", "Profile"], "p.s1": ["Identité", "Identity"], "p.s2": ["Parcours", "Background"], "p.s3": ["Pièces jointes", "Attachments"], "p.s4": ["Vérification", "Review"],
  "p.s1.d": ["Votre identité et vos coordonnées.", "Your identity and contact details."],
  "p.s2.d": ["Votre établissement et vos résultats.", "Your institution and results."],
  "p.s3.d": ["Documents justificatifs de votre dossier.", "Supporting documents for your application."],
  "p.s4.t": ["Vérifiez votre dossier", "Review your application"],
  "p.s4.d": ["Relisez vos informations avant l'envoi définitif.", "Check your information before final submission."],
  "p.need": ["Ce qu'il vous faudra", "What you will need"],
  "p.need.id": ["Votre pièce d'identité (CNI, passeport ou acte de naissance)", "Your ID (ID card, passport or birth certificate)"],
  "p.need.rc": ["Vos bulletins de l'année {year} (moyenne, rang, effectif)", "Your {year} report cards (average, position, class size)"],
  "p.need.tr": ["Vos relevés de notes {year} (moyenne, classement)", "Your {year} transcripts (average, ranking)"],
  "p.need.gce": ["Votre relevé GCE, si vous avez passé l'examen", "Your GCE result slip, if you sat the exam"],
  "p.need.par": ["Si vous avez moins de 18 ans : les coordonnées d'un parent ou tuteur", "If you are under 18: a parent or guardian's contact details"],
  "p.prev": ["← Précédent", "← Back"], "p.next": ["Continuer →", "Continue →"]
};
</script>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">ZTF</span><span data-i18n="brand.name"></span></div>
  <div class="r"><span class="help"><span data-i18n="p.help"></span> <a href="mailto:contact@excellenceawardsztf.com">contact@excellenceawardsztf.com</a></span><div data-ztf-slot="lang"></div></div>
</header>

<div data-ztf-hide-on-success>
  <section class="intro">
    <h1 data-i18n="p.title"></h1>
    <p data-i18n="p.lead"></p>
    <div class="deadline"><span data-i18n="deadline.label"></span> · <span data-i18n-html="deadline.text"></span></div>
  </section>

  <ol class="steps" id="steps">
    <li><span><span data-i18n="p.step"></span> 1</span><b data-i18n="p.s0"></b></li>
    <li><span><span data-i18n="p.step"></span> 2</span><b data-i18n="p.s1"></b></li>
    <li><span><span data-i18n="p.step"></span> 3</span><b data-i18n="p.s2"></b></li>
    <li><span><span data-i18n="p.step"></span> 4</span><b data-i18n="p.s3"></b></li>
    <li><span><span data-i18n="p.step"></span> 5</span><b data-i18n="p.s4"></b></li>
  </ol>

  <main class="panel">
    <form class="card" data-ztf-form>
      <section class="step profile" data-step>
        <div class="step-h"><div><h2 data-i18n="sec.profile"></h2><p data-i18n="sec.profile.s"></p></div><span class="k">1 / 5</span></div>
        <div data-ztf-slot="cycle"></div>
        <div data-ztf-slot="subsystem"></div>
        <div class="need"><h3 data-i18n="p.need"></h3><ul>
          <li data-i18n="p.need.id"></li>
          <li id="need-res" data-i18n="p.need.rc"></li>
          <li id="need-gce" data-i18n="p.need.gce" hidden></li>
          <li id="need-par" data-i18n="p.need.par"></li>
        </ul></div>
      </section>
      <section class="step" data-step hidden>
        <div class="step-h"><div><h2 data-i18n="sec.identity"></h2><p data-i18n="p.s1.d"></p></div><span class="k">2 / 5</span></div>
        <div data-ztf-slot="identity"></div>
      </section>
      <section class="step" data-step hidden>
        <div class="step-h"><div><h2 data-i18n="sec.academic"></h2><p data-i18n="p.s2.d"></p></div><span class="k">3 / 5</span></div>
        <div data-ztf-slot="academic"></div>
      </section>
      <section class="step" data-step hidden>
        <div class="step-h"><div><h2 data-i18n="sec.attachments"></h2><p data-i18n="p.s3.d"></p></div><span class="k">4 / 5</span></div>
        <div data-ztf-slot="attachments"></div>
      </section>
      <section class="step" data-step hidden>
        <div class="step-h"><div><h2 data-i18n="p.s4.t"></h2><p data-i18n="p.s4.d"></p></div><span class="k">5 / 5</span></div>
        <div data-ztf-recap></div>
        <div class="consent-box" data-ztf-slot="consent"></div>
      </section>
      <div class="actions">
        <button type="button" class="btn" id="prev" data-i18n="p.prev" hidden></button>
        <button type="button" class="btn primary" id="next" data-i18n="p.next"></button>
      </div>
    </form>
  </main>
</div>

<main class="panel" data-ztf-success hidden>
  <div class="card success">
    <div class="ok">✓</div>
    <h2 data-i18n="success.title"></h2>
    <p><span data-i18n="success.text"></span> <strong data-ztf-success-email></strong></p>
    <button class="btn" type="button" data-ztf-reset data-i18n="btn.new"></button>
  </div>
</main>

<script src="shared/form-data.js"></script>
<script src="shared/form-i18n.js"></script>
<script src="shared/form-markup.js"></script>
<script src="shared/form-engine.js"></script>
<script>
(function () {
  var steps, cur = 0, maxReached = 0, last;
  var lis = [].slice.call(document.querySelectorAll("#steps li"));
  var prev = document.getElementById("prev"), next = document.getElementById("next");
  function show(i) {
    cur = i; maxReached = Math.max(maxReached, i);
    steps.forEach(function (s, k) { s.hidden = k !== i; });
    lis.forEach(function (li, k) { li.className = k === i ? "cur" : k <= maxReached ? "done" : ""; });
    prev.hidden = i === 0; next.hidden = i === last;
    if (i === last) recap();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function recap() {
    ZTF.renderRecap();
    [].forEach.call(document.querySelectorAll(".ztf-recap-group h4"), function (h, k) {
      var b = document.createElement("button"); b.type = "button"; b.className = "edit"; b.textContent = ZTF.tr("recap.edit");
      b.addEventListener("click", function () { show(k + 1); }); h.appendChild(b);
    });
  }
  // La liste « Ce qu'il vous faudra » suit le profil choisi.
  function needs() {
    var f = document.querySelector("[data-ztf-form]").elements, sec = f.cycle.value === "secondary";
    var res = document.getElementById("need-res"); res.setAttribute("data-i18n", sec ? "p.need.rc" : "p.need.tr");
    res.textContent = ZTF.tr(sec ? "p.need.rc" : "p.need.tr");
    document.getElementById("need-gce").hidden = !(sec && f.subsystem.value === "anglophone");
    document.getElementById("need-par").hidden = f.cycle.value === "higher";
  }
  function init() {
    steps = [].slice.call(document.querySelectorAll("[data-step]")); last = steps.length - 1;
    next.addEventListener("click", function () { if (ZTF.validate(steps[cur])) show(cur + 1); });
    prev.addEventListener("click", function () { show(cur - 1); });
    lis.forEach(function (li, k) { li.addEventListener("click", function () { if (k <= maxReached && k !== cur && (k < cur || ZTF.validate(steps[cur]))) show(k); }); });
    document.addEventListener("ztf:invalid", function (e) { steps.forEach(function (s, k) { if (s.contains(e.detail.first) && k !== cur) show(k); }); });
    document.addEventListener("ztf:reset", function () { maxReached = 0; show(0); needs(); });
    document.addEventListener("ztf:demo", function () { maxReached = last; show(cur); needs(); });
    document.addEventListener("ztf:lang", function () { if (cur === last) recap(); needs(); });
    document.querySelector("[data-ztf-form]").addEventListener("change", needs);
    show(0); needs();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
</body>
</html>
