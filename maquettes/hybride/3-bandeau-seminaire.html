<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidature Prix ZTF · Bandeau séminaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Great+Vibes&family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../affiche/affiche.css">
<link rel="stylesheet" href="hybride.css">
<style>
.hero{color:#fff;text-align:center;padding:46px 16px 120px;background:linear-gradient(135deg,var(--green-d),var(--green) 60%,var(--green-l))}
.hero .h-script{font-size:clamp(3rem,7vw,4.8rem);margin-top:6px}
.hero .h-name{font-size:clamp(1.3rem,3.2vw,2.2rem)}
.hero .sub{margin:10px 0 0;font-weight:600;opacity:.92}
.wrap{max-width:960px;margin:-86px auto 0;padding:0 16px 64px;position:relative;z-index:2}
.strip{position:relative;margin-bottom:18px;box-shadow:0 16px 40px rgba(3,8,66,.25);border:1px solid rgba(232,185,60,.4)}
.strip .seal{position:absolute;left:-30px;top:-34px}
@media(max-width:1040px){.strip .seal{position:static}}
.cats{margin:0 0 26px;border:1px solid var(--line-l);border-radius:14px;background:#f8faf9;padding:4px 14px}
.cats summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--site-navy)}
.cats .prizes{margin:4px 0 12px;font-size:.84rem}
.card{border-top:5px solid #f2c94c}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="#"><span class="mark">ZTF</span><span><span data-i18n="brand.name"></span><small data-i18n="brand.org"></small></span></a>
  <div class="right">
    <nav class="nav"><a href="#" data-i18n="p.nav.home"></a><a href="#" data-i18n="p.nav.prize"></a><a href="#" data-i18n="p.nav.winners"></a><a class="on" href="#" data-i18n="p.nav.apply"></a><a href="#" data-i18n="p.nav.contact"></a></nav>
    <div data-ztf-slot="lang"></div>
  </div>
</div></header>

<section class="hero sparkle">
  <div class="eyebrow" data-i18n="h.eyebrow"></div>
  <div class="h-script">Prix d'Excellence</div>
  <h1 class="h-name gold-on-green">Zacharias Tanee Fomum</h1>
  <p class="sub" data-i18n="h.apply"></p>
</section>
<main class="wrap">
  <div class="strip sparkle" data-ztf-hide-on-success>
    <div class="seal sm"><div><small data-i18n="a.until"></small><b data-i18n="a.until.date"></b></div></div>
    <div class="event"><div><b data-i18n="a.date"></b><span data-i18n="a.year"></span></div><div><b data-i18n="a.time"></b><span data-i18n="a.city"></span></div><div><b data-i18n="a.venue"></b><span data-i18n="a.seminar.short"></span></div></div>
    <div data-cd-open><div class="countdown"><div><b data-cd="d">00</b><span data-i18n="a.cd.days"></span></div><div><b data-cd="h">00</b><span data-i18n="a.cd.hours"></span></div><div><b data-cd="m">00</b><span data-i18n="a.cd.min"></span></div><div><b data-cd="s">00</b><span data-i18n="a.cd.sec"></span></div></div></div>
  </div>
  <div class="card form-site">
    <div data-ztf-hide-on-success>
      <details class="cats"><summary data-i18n="h.cat"></summary><table class="prizes"><thead><tr><th data-i18n="a.cat.col1"></th><th data-i18n="a.cat.col2"></th></tr></thead><tbody>
  <tr class="is-this"><td><span data-i18n="a.cat.1"></span><span class="this" data-i18n="a.cat.this"></span></td><td data-i18n="a.cat.1c"></td></tr>
  <tr><td data-i18n="a.cat.2"></td><td data-i18n="a.cat.2c"></td></tr><tr><td data-i18n="a.cat.3"></td><td data-i18n="a.cat.3c"></td></tr>
  <tr><td data-i18n="a.cat.4"></td><td data-i18n="a.cat.4c"></td></tr><tr><td data-i18n="a.cat.5"></td><td data-i18n="a.cat.5c"></td></tr>
  <tr><td data-i18n="a.cat.6"></td><td data-i18n="a.cat.6c"></td></tr><tr><td data-i18n="a.cat.7"></td><td data-i18n="a.cat.7c"></td></tr></tbody></table></details>
      <div data-ztf-slot="lookup"></div>
      <form data-ztf-form>
        <section class="sec" id="s1" data-ztf-section><div class="sec-h"><span class="n">1</span><h2 data-i18n="sec.identity"></h2></div><div data-ztf-slot="identity"></div></section>
        <section class="sec" id="s2" data-ztf-section><div class="sec-h"><span class="n">2</span><h2 data-i18n="sec.academic"></h2></div><div data-ztf-slot="academic"></div></section>
        <section class="sec" id="s3" data-ztf-section><div class="sec-h"><span class="n">3</span><h2 data-i18n="sec.attachments"></h2></div><div data-ztf-slot="attachments"></div></section>
        <div data-ztf-slot="consent"></div>
      </form>
    </div>
    <div class="success" data-ztf-success hidden>
      <div class="ok">✓</div>
      <h2 data-i18n="success.title"></h2>
      <div data-ztf-slot="receipt"></div>
      <button class="again" type="button" data-ztf-reset data-i18n="btn.new"></button>
    </div>
  </div>
</main>
<footer class="site"><strong data-i18n="brand.org"></strong> · <span data-i18n="brand.name"></span>
  <div class="contacts">excellenceawardsztf.com · ☎ <span data-i18n="a.phones"></span></div>
  <div style="margin-top:6px;opacity:.7"><span data-i18n="h.mock"></span> · 3</div></footer>
<script>window.ZTF_PAGE_I18N = { "a.seminar.short": ["Séminaire Acte IX", "Seminar Act IX"] };</script>
<script src="../shared/form-data.js"></script>
<script src="../shared/ztf-lists.js"></script>
<script src="../shared/form-i18n.js"></script>
<script src="hybride.js"></script>
<script src="../affiche/affiche.js"></script>
<script src="../shared/form-markup.js"></script>
<script src="../shared/form-engine.js"></script>
</body>
</html>
