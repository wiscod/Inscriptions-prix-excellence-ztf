<style>
.hero{color:#fff;text-align:center;padding:56px 16px 130px;background:linear-gradient(180deg,rgba(31,122,64,.72),rgba(31,122,64,.93) 75%),url(../affiche/img/laureat.jpg) center 35%/cover}
.hero .h-script{font-size:clamp(3rem,7vw,4.8rem);margin-top:6px}
.hero .h-name{font-size:clamp(1.3rem,3.2vw,2.2rem)}
.hero .sub{margin:10px 0 0;font-weight:600;opacity:.92}
.wrap{max-width:960px;margin:-86px auto 0;padding:0 16px 64px;position:relative;z-index:2}
.strip{position:relative;margin-bottom:18px;box-shadow:0 16px 40px rgba(3,8,66,.25);border:1px solid rgba(232,185,60,.4)}
.strip .seal{position:absolute;left:-30px;top:-34px}

.strip .tro{height:112px;border-radius:14px;box-shadow:0 0 0 3px #e8b93c,0 10px 24px rgba(0,0,0,.35)}
.strip .event>div{padding:4px 16px}

@media(max-width:700px){.strip .tro{display:none}}
@media(max-width:1040px){.strip .seal{position:static}}
.cats{margin:0 0 26px;border:1px solid var(--line-l);border-radius:14px;background:#f8faf9;padding:4px 14px}
.cats summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--site-navy)}
.cats .prizes{margin:4px 0 12px;font-size:.84rem}
.card{border-top:5px solid #f2c94c}
