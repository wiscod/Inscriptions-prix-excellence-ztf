.hero{position:relative;overflow:hidden;color:#fff;padding:56px 16px 150px;

.hero .event{justify-content:flex-start}.hero .event>div:first-child{padding-left:0}
.hero .gold-rule{justify-content:flex-start}.hero .gold-rule:before{display:none}
@media(max-width:760px){.hero{background:linear-gradient(180deg,rgba(31,122,64,.8),rgba(31,122,64,.95) 70%),url(../affiche/img/laureat.jpg) center/cover}}

.hero .h-script{font-size:clamp(3rem,7vw,5rem);margin-top:6px}
.hero .h-name{font-size:clamp(1.4rem,3.4vw,2.4rem)}
.hero .gold-rule{margin:12px 0 0;max-width:420px;font-family:Cinzel,serif;font-weight:700;color:#fff3c4}
.hero .gold-rule:after{background:linear-gradient(90deg,#ffe27a,transparent)}
.hero .event{margin-top:20px}.hero .event b{color:#fff3c4}
.hero .event>div{border-color:#ffe27a}
.wrap{max-width:920px;margin:-90px auto 0;padding:0 16px 64px;position:relative;z-index:2}
.card .seal{position:absolute;top:-56px;right:-34px}
@media(max-width:900px){.card .seal{position:static;margin:-70px auto 18px;transform:rotate(-6deg)}}
